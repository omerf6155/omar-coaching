<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="60%" stop-color="#0d0e12"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Gold Foil Gradients -->
    <linearGradient id="goldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="25%" stop-color="#ffd60a"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="90%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="metallicStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd60a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Deep Ambient Glow -->
    <radialGradient id="auraGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#ffd60a" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Bevel Border -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#metallicStroke)" stroke-width="4"/>

  <!-- Golden Aura Ambient Glow behind emblem -->
  <circle cx="256" cy="235" r="170" fill="url(#auraGlow)"/>

  <!-- Geometric Outer Hexagon-Shield (Aesthetic Discipline) -->
  <polygon points="256,64 394,142 394,302 256,380 118,302 118,142" 
           fill="none" 
           stroke="url(#goldPrimary)" 
           stroke-width="5" 
           stroke-linejoin="round"
           opacity="0.45"/>

  <!-- Inner Diamond Facet Lines -->
  <polygon points="256,88 370,154 370,288 256,354 142,288 142,154" 
           fill="#0d0f14" 
           fill-opacity="0.65"
           stroke="url(#goldLight)" 
           stroke-width="2" 
           stroke-dasharray="8 6"
           opacity="0.35"/>

  <!-- CENTRAL EMBLEM: Stylized Monogram "OC" + Crown & Barbell Crest -->
  <g filter="url(#goldGlow)">
    <!-- Crown Apex (Top Center Peak) -->
    <polygon points="256,108 274,152 238,152" fill="url(#goldPrimary)"/>
    <polygon points="208,126 226,160 196,160" fill="url(#goldPrimary)"/>
    <polygon points="304,126 316,160 286,160" fill="url(#goldPrimary)"/>

    <!-- Winged Shoulder / Trapezius Wings -->
    <path d="M 148,198 C 172,176 216,168 256,168 C 296,168 340,176 364,198 C 342,216 308,220 256,220 C 204,220 170,216 148,198 Z" 
          fill="url(#goldLight)" 
          opacity="0.95"/>

    <!-- The Bold Stylized "O" Ring (External Armor) -->
    <path d="M 256,160 C 200,160 156,204 156,260 C 156,316 200,360 256,360 C 312,360 356,316 356,260 C 356,204 312,160 256,160 Z 
             M 256,192 C 294,192 324,222 324,260 C 324,298 294,328 256,328 C 218,328 188,298 188,260 C 188,222 218,192 256,192 Z" 
          fill="url(#goldPrimary)" 
          fill-rule="evenodd"/>

    <!-- The Inner "C" Swoosh Cut / Geometric Muscle Fiber Core -->
    <path d="M 284,218 C 252,212 218,228 214,260 C 210,292 242,308 274,306 C 286,305 296,301 304,294 L 320,314 C 304,328 284,334 262,334 C 210,334 178,298 182,252 C 186,208 228,186 280,192 Z" 
          fill="url(#goldLight)"/>

    <!-- Barbell Plate Collar Accents -->
    <rect x="130" y="246" width="16" height="28" rx="4" fill="url(#goldPrimary)"/>
    <rect x="366" y="246" width="16" height="28" rx="4" fill="url(#goldPrimary)"/>

    <!-- Central Power Lightning Core -->
    <polygon points="256,218 266,252 254,256 264,294 246,260 258,256" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Typography: OMAR COACHING -->
  <g text-anchor="middle">
    <!-- Brand Name -->
    <text x="256" y="420" 
          font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', 'Arial Black', sans-serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="9" 
          fill="url(#goldLight)">
      OMAR
    </text>
    
    <text x="256" y="448" 
          font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', sans-serif" 
          font-size="14" 
          font-weight="700" 
          letter-spacing="12" 
          fill="#94a3b8" 
          opacity="0.85">
      COACHING
    </text>

    <!-- Bottom Performance Line Accent -->
    <rect x="206" y="468" width="100" height="3" rx="1.5" fill="url(#goldPrimary)" opacity="0.7"/>
  </g>
</svg>
